<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هانا ♥ بازی عاشقانه</title>
<style>
:root{--t:#fff;--t2:rgba(255,255,255,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;color:var(--t);background:#000;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(50% 30% at 15% 8%,rgba(255,45,111,.28) 0,transparent 70%),radial-gradient(50% 35% at 90% 40%,rgba(123,61,255,.22) 0,transparent 70%),radial-gradient(60% 35% at 30% 100%,rgba(255,45,111,.18) 0,transparent 70%),radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 12%,#fff,transparent),radial-gradient(1px 1px at 55% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 70%,#fff,transparent),radial-gradient(1px 1px at 30% 60%,#fff,transparent),radial-gradient(1px 1px at 65% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 8% 90%,#fff,transparent),#000;animation:tw 5s ease-in-out infinite alternate}@keyframes tw{from{filter:brightness(.8)}to{filter:brightness(1.15)}}
.wrap{max-width:460px;margin:0 auto;padding:28px 20px 40px;text-align:center}
h1{font-size:36px;margin:8px 0 6px;background:linear-gradient(90deg,#fff,#ff7aa8 60%,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px rgba(255,45,111,.5))}
.sub{color:var(--t2);margin:0 0 26px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 10px;justify-items:center}
.app{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:inherit;font:inherit}
.icon{position:relative;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;
background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.03)),rgba(18,18,22,.6);
backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
border:1px solid rgba(255,255,255,.45);
box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -8px 16px rgba(255,255,255,.12),inset 0 0 24px rgba(255,255,255,.1),0 14px 30px rgba(0,0,0,.35);
transition:transform .2s}
.icon::before{content:"";position:absolute;top:4px;left:8%;right:8%;height:42%;border-radius:22px 22px 40px 40px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.icon::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 110%,var(--c),transparent 70%);opacity:.75}
.icon svg{position:relative;z-index:1;width:46px;height:46px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.app:active .icon{transform:scale(.92)}
.app.lock{opacity:.55;filter:saturate(.5)}
.app .lbl{font-size:14px}
.badge{position:absolute;z-index:2;top:-6px;right:-6px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.5)}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.02)),rgba(14,14,18,.65);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.35);border-radius:30px;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 20px 50px rgba(0,0,0,.4)}
#game{display:none;margin-top:6px;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:15px}
.pill{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;font:inherit;cursor:pointer}
#area{position:relative;height:400px;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.h{position:absolute;top:-50px;font-size:38px;cursor:pointer;animation:fall 4s linear forwards;filter:drop-shadow(0 4px 8px rgba(255,61,129,.7))}
@keyframes fall{to{transform:translateY(470px)}}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;height:100%;align-content:center}
.card{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-size:32px;cursor:pointer;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 1px rgba(255,255,255,.7)}
.card.f{background:rgba(255,61,129,.45)}
.card.ok{background:rgba(120,255,180,.35)}
.mv{position:absolute;font-size:44px;cursor:pointer;transition:left .45s,top .45s;filter:drop-shadow(0 4px 10px rgba(255,61,129,.8))}
.msg{padding:12px 4px 2px;color:var(--t2);font-size:14px}
#fin{display:none;margin-top:10px;padding:26px 20px}
#fin h2{margin:0 0 12px;font-size:26px}
.txt{white-space:pre-line;padding:16px;border-radius:20px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.25);line-height:2;font-size:16px;margin:0 0 18px;text-align:right}
.btn{display:block;width:100%;padding:15px;margin-top:10px;border-radius:22px;font:inherit;font-size:17px;color:#fff;text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.5);background:linear-gradient(145deg,rgba(255,61,129,.75),rgba(123,61,255,.6));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),0 10px 26px rgba(255,61,129,.4)}
.btn.g{background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.08))}
.icon{width:104px;height:104px;border-radius:32px;box-shadow:inset 0 2px 1px rgba(255,255,255,.9),inset 0 -12px 20px rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.08),0 0 30px color-mix(in srgb,var(--c) 50%,transparent),0 18px 34px rgba(0,0,0,.65)}
.icon::before{border-radius:28px 28px 50px 50px}
.icon svg{width:64px;height:64px;overflow:visible}
.app:not(.lock) .icon{animation:bob 3.6s ease-in-out infinite}
.app:nth-child(2) .icon{animation-delay:-.9s}.app:nth-child(3) .icon{animation-delay:-1.8s}.app:nth-child(4) .icon{animation-delay:-2.7s}
@keyframes bob{50%{transform:translateY(-8px)}}
.shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:2;pointer-events:none}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sw 3.8s ease-in-out infinite}
@keyframes sw{0%,55%{left:-60%}100%{left:130%}}
.badge{top:-8px;right:-8px;z-index:3;background:rgba(20,20,24,.7);border-color:rgba(255,255,255,.5);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.app .lbl{font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.hb,.f1,.f2,.wig,.fly,.tw,.ln{transform-box:fill-box;transform-origin:center}
.hb{animation:hb 1.4s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.f1{animation:f1 2.8s ease-in-out infinite alternate}.f2{animation:f2 2.8s ease-in-out infinite alternate}
@keyframes f1{to{transform:rotate(-8deg) translateX(-2px)}}@keyframes f2{to{transform:rotate(7deg) translateY(-2px)}}
.wig{animation:wig 1.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(4px,-3px) rotate(6deg)}}
.fly{animation:fly 2.2s ease-in-out infinite}
@keyframes fly{50%{transform:translate(4px,-5px) rotate(-4deg)}}
.tw{animation:tws 1.8s ease-in-out infinite}.tw.d2{animation-delay:-.9s}
@keyframes tws{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.ln{animation:ln 1.2s ease-in-out infinite}
@keyframes ln{50%{opacity:.2;transform:translateX(-4px)}}
.fl{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fl span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 8px rgba(255,45,111,.7))}
@keyframes rise{10%{opacity:.7}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <h1>هانا جان 💖</h1>
  <p class="sub">مرحله‌ها رو رد کن تا به سورپرایز آخر برسی</p>
  <div class="grid" id="grid"></div>
  <div class="glass" id="game">
    <div class="bar"><button class="pill" id="back">← بازگشت</button><span id="ttl"></span><span id="sc"></span></div>
    <div id="area"></div>
    <div class="msg" id="hint"></div>
  </div>
  <div class="glass" id="fin">
    <h2>تمام شد! 🎉</h2>
    <p class="sub" style="margin-bottom:14px">همه مرحله‌ها رو رد کردی، حالا این پیام عاشقانه رو برام بفرست:</p>
    <p class="txt" id="love"></p>
    <a class="btn" id="tg" target="_blank" rel="noopener">ارسال به تلگرام @Reralo ✈️</a>
    <button class="btn g" id="cp">کپی متن پیام</button>
  </div>
</div>
<script>
var S={heart:'<svg viewBox="0 0 48 48"><path d="M24 42S6 31 6 18.5C6 12 11 8 16 8c3.5 0 6.5 2 8 5 1.5-3 4.5-5 8-5 5 0 10 4 10 10.5C42 31 24 42 24 42z" fill="#fff"/></svg>',
card:'<svg viewBox="0 0 48 48"><rect x="6" y="10" width="15" height="22" rx="3" fill="#fff"/><rect x="25" y="10" width="15" height="22" rx="3" fill="#fff" opacity=".7"/><rect x="10" y="36" width="28" height="4" rx="2" fill="#fff" opacity=".6"/></svg>',
target:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="none" stroke="#fff" stroke-width="4"/><circle cx="24" cy="24" r="9" fill="none" stroke="#fff" stroke-width="4"/><circle cx="24" cy="24" r="3.5" fill="#fff"/></svg>',
send:'<svg viewBox="0 0 48 48"><path d="M42 7L5 21l10 4 4 13 6-8 9 7z" fill="#fff"/></svg>'};
var G=function(id,a,b){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs>'};
var SP=function(x,y,s,c){return '<path class="tw '+(c||'')+'" transform="translate('+x+' '+y+') scale('+s+')" d="M0-6l1.8 4.2L6 0l-4.2 1.8L0 6l-1.8-4.2L-6 0l4.2-1.8z" fill="#fff"/>'};
var S2={heart:'<svg viewBox="0 0 64 64">'+G('g1','#fff','#ffb3cc')+'<g class="hb"><path d="M32 56S8 41 8 23C8 14 15 9 21 9c5 0 9 3 11 7 2-4 6-7 11-7 6 0 13 5 13 14 0 18-24 33-24 33z" fill="url(#g1)"/><path d="M16 21c1-4 4-7 8-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".95"/></g>'+SP(55,9,1.2)+SP(8,46,.9,'d2')+'</svg>',
card:'<svg viewBox="0 0 64 64">'+G('g2','#fff','#ffd98a')+'<g class="f1"><rect x="7" y="14" width="26" height="36" rx="6" fill="#fff" opacity=".55" transform="rotate(-14 20 32)"/></g><g class="f2"><rect x="28" y="11" width="27" height="39" rx="6" fill="url(#g2)"/><path d="M41.500 42C41.500 42 33 37 33 31C33 28 35 26.500 37.200 26.500C39.200 26.500 40.700 27.500 41.500 29.200C42.300 27.500 43.800 26.500 45.800 26.500C48 26.500 50 28 50 31C50 37 41.500 42 41.500 42Z" fill="#ff4d6d"/></g>'+SP(56,8,1.1)+SP(6,54,.8,'d2')+'</svg>',
target:'<svg viewBox="0 0 64 64">'+G('g3','#fff','#e3c2ff')+'<path class="ln" d="M3 24h11M1 34h15M6 44h10" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".8"/><g class="wig"><path d="M38 53C38 53 19 41 19 27C19 20 24 16 28.500 16C33 16 36 19 38 22.500C40 19 43 16 47.500 16C52 16 57 20 57 27C57 41 38 53 38 53Z" fill="url(#g3)"/><path d="M25 25c1-3 3-5 6-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>'+SP(54,8,1.1)+'</svg>',
send:'<svg viewBox="0 0 64 64">'+G('g4','#fff','#b5dcff')+'<path class="ln" d="M3 46c8-1 13-5 17-8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/><g class="fly"><path d="M58 7L7 28l15 6 6 19 9-11 13 10z" fill="url(#g4)"/><path d="M22 34L58 7 29 41z" fill="#7fc0ff" opacity=".9"/></g>'+SP(10,10,1,'d2')+SP(56,54,.9)+'</svg>'};
var L=[{n:'قلب‌ها رو بگیر',i:S2.heart,c:'#ff2d6f'},{n:'کارت‌های عشق',i:S2.card,c:'#ff9f0a'},{n:'قلب فراری',i:S2.target,c:'#bf5af2'},{n:'پیام عاشقانه',i:S2.send,c:'#0a84ff'}];
var MSG=`سلام ممد جان، عشق من 💖

همه‌ی مرحله‌ها رو رد کردم تا برسم به تو؛ چون هر راهی که آخرش تو باشی، ارزش قدم برداشتن داره.

تو آرامش دل منی، قشنگ‌ترین اتفاق زندگی‌م و دلیل همه‌ی لبخندهام. کنار تو دنیا مهربون‌تر و روزها روشن‌تره.

دوستت دارم، امروز بیشتر از دیروز و فردا بیشتر از امروز 🌹

هانای تو ✨`;var MSG0='سلام ممد جان 💖 من هانام! همه مرحله‌ها رو رد کردم و رسیدم بهت. می‌خواستم بگم خیلی دوستت دارم، تو بهترین اتفاق زندگی منی و کنارت بودن قشنگ‌ترین حس دنیاست 🌹';
var unlocked=1,timers=[],area=document.getElementById('area');
function $(i){return document.getElementById(i)}
function render(){var g=$('grid');g.innerHTML='';L.forEach(function(l,k){var b=document.createElement('button');b.className='app'+(k<unlocked?'':' lock');
b.innerHTML='<div class="icon" style="--c:'+l.c+'">'+l.i+'<i class="shine"></i><span class="badge">'+(k>=unlocked?'🔒':(k<unlocked-1?'✓':'✨'))+'</span></div><span class="lbl">'+l.n+'</span>';
b.onclick=function(){k<unlocked?start(k):0};g.appendChild(b)})}
function clear(){timers.forEach(function(t){clearInterval(t);clearTimeout(t)});timers=[];area.innerHTML=''}
function start(k){clear();if(k==3){showFin();return}
$('fin').style.display='none';$('game').style.display='block';$('ttl').textContent='مرحله '+(k+1);$('sc').textContent='';
[l1,l2,l3][k](k);$('game').scrollIntoView({behavior:'smooth'})}
function win(k){clear();if(unlocked<k+2)unlocked=k+2;render();
area.innerHTML='<div style="height:100%;display:grid;place-items:center;text-align:center;padding:20px"><div><div style="font-size:60px">🎉</div><p style="font-size:20px">آفرین هانا! مرحله رو رد کردی</p><button class="btn" id="nx">'+(k<2?'مرحله بعد':'برو به سورپرایز')+'</button></div></div>';
$('nx').onclick=function(){start(k+1)}}
function l1(k){var n=0,T=10;$('hint').textContent='روی قلب‌ها بزن؛ '+T+' تا بگیر!';$('sc').textContent='0/'+T;
timers.push(setInterval(function(){var h=document.createElement('div');h.className='h';h.textContent=['💖','💗','💓','💕'][Math.random()*4|0];
h.style.left=(Math.random()*85+2)+'%';h.style.animationDuration=(3+Math.random()*1.5)+'s';
var hit=function(e){e.preventDefault();h.remove();n++;$('sc').textContent=n+'/'+T;if(n>=T)win(k)};
h.addEventListener('pointerdown',hit);h.addEventListener('animationend',function(){h.remove()});area.appendChild(h)},650))}
function l2(k){var e=['💖','🌹','💌','✨'],d=e.concat(e).sort(function(){return Math.random()-.5}),open=[],done=0,busy=false;
$('hint').textContent='جفت‌ها رو پیدا کن!';$('sc').textContent='0/4';
var m=document.createElement('div');m.className='mem';
d.forEach(function(v){var c=document.createElement('div');c.className='card';c.textContent='❔';
c.onclick=function(){if(busy||c.classList.contains('f')||c.classList.contains('ok'))return;c.classList.add('f');c.textContent=v;open.push(c);
if(open.length==2){busy=true;var a=open[0],b=open[1];
timers.push(setTimeout(function(){if(a.textContent==b.textContent){a.className=b.className='card ok';done++;$('sc').textContent=done+'/4';if(done==4){win(k);return}}
else{a.className=b.className='card';a.textContent=b.textContent='❔'}open=[];busy=false},650))}};m.appendChild(c)});area.appendChild(m)}
function l3(k){var n=0,T=12,h=document.createElement('div');h.className='mv';h.textContent='💘';area.appendChild(h);
$('hint').textContent='قلب فراری رو '+T+' بار بگیر!';$('sc').textContent='0/'+T;
function mv(){h.style.left=(Math.random()*(area.clientWidth-60))+'px';h.style.top=(Math.random()*(area.clientHeight-60))+'px'}
mv();var sp=900;function loop(){mv();timers.push(setTimeout(loop,sp))}timers.push(setTimeout(loop,sp));
h.addEventListener('pointerdown',function(e){e.preventDefault();n++;sp=Math.max(450,sp-40);$('sc').textContent=n+'/'+T;if(n>=T){win(k);return}mv()})}
function showFin(){clear();$('game').style.display='none';$('fin').style.display='block';$('love').textContent=MSG;
$('tg').href='https://t.me/Reralo?text='+encodeURIComponent(MSG);$('fin').scrollIntoView({behavior:'smooth'})}
$('back').onclick=function(){clear();$('game').style.display='none'};
$('cp').onclick=function(){var b=$('cp');function ok(){b.textContent='کپی شد ✓'}
try{navigator.clipboard.writeText(MSG).then(ok,function(){fb()})}catch(e){fb()}
function fb(){var t=document.createElement('textarea');t.value=MSG;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){}t.remove()}};
(function(){var f=document.createElement('div');f.className='fl';for(var i=0;i<14;i++){var s=document.createElement('span');s.textContent=['💖','💗','✨','💕'][i%4];s.style.left=(Math.random()*96)+'%';s.style.fontSize=(12+Math.random()*16)+'px';s.style.animationDuration=(9+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*14)+'s';f.appendChild(s)}document.body.appendChild(f)})();
render();
</script>
